<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MRREDSPY // Winter Pixel Edition</title>
    <style>
        /* Шрифты и общие пиксельные стили */
        @import url('https://googleapis.com');

        * {
            box-sizing: border-box;
            user-select: none;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #0b111e;
            color: #e0f2fe;
            font-family: 'Press Start 2P', monospace;
            font-size: 10px;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        /* Задний фон: холст для снега */
        #snowCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        /* Главный контейнер карточки */
        .card {
            position: relative;
            z-index: 10;
            width: 420px;
            background: rgba(15, 23, 42, 0.85);
            border: 4px solid #38bdf8;
            padding: 24px;
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.4), inset 0 0 10px rgba(56, 189, 248, 0.2);
            image-rendering: pixelated;
        }

        /* Ледяные уголки карточки */
        .card::before, .card::after {
            content: '';
            position: absolute;
            width: 12px;
            height: 12px;
            background: #bae6fd;
        }
        .card::before { top: -8px; left: -8px; box-shadow: 8px 0 #bae6fd, 0 8px #bae6fd; }
        .card::after { bottom: -8px; right: -8px; box-shadow: -8px 0 #bae6fd, 0 -8px #bae6fd; }

        .status {
            color: #7dd3fc;
            font-size: 8px;
            margin-bottom: 12px;
            text-shadow: 2px 2px #0369a1;
        }

        .nickname {
            font-size: 20px;
            color: #ffffff;
            margin-bottom: 24px;
            text-align: center;
            text-shadow: 3px 3px #0284c7;
            letter-spacing: 1px;
        }

        /* Поля данных */
        .field {
            background: #0f172a;
            border: 2px solid #0284c7;
            padding: 12px;
            margin-bottom: 16px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            position: relative;
        }

        .field-label {
            font-size: 7px;
            color: #7dd3fc;
        }

        .field-value {
            font-size: 11px;
            color: #f1f5f9;
        }

        /* Кнопки */
        .btn {
            font-family: 'Press Start 2P', monospace;
            background: #0284c7;
            border: none;
            border-bottom: 4px solid #0369a1;
            color: white;
            padding: 8px 12px;
            cursor: pointer;
            font-size: 8px;
            image-rendering: pixelated;
        }

        .btn:active {
            border-bottom: 0;
            margin-top: 4px;
            margin-bottom: -4px;
            background: #0369a1;
        }

        .copy-btn {
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
        }

        .tetris-trigger {
            width: 100%;
            padding: 12px;
            background: #059669;
            border-bottom: 4px solid #047857;
            font-size: 10px;
            margin-top: 10px;
        }
        .tetris-trigger:active { background: #047857; }

        /* Музыкальный плеер снизу справа */
        .audio-player {
            position: absolute;
            bottom: 16px;
            right: 16px;
            z-index: 20;
            background: rgba(15, 23, 42, 0.9);
            border: 2px solid #38bdf8;
            padding: 10px;
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 7px;
            max-width: 250px;
        }

        .track-name {
            color: #7dd3fc;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Модальное окно Тетриса */
        .tetris-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 100;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        .tetris-container {
            background: #1e293b;
            border: 4px solid #38bdf8;
            padding: 10px;
            display: flex;
            gap: 10px;
        }

        #tetrisCanvas {
            background: #0f172a;
            border: 2px solid #0284c7;
        }

        .tetris-info {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            color: white;
            font-size: 8px;
            width: 100px;
        }

        .close-tetris {
            margin-top: 15px;
            background: #ef4444;
            border-bottom: 4px solid #b91c1c;
        }
        .close-tetris:active { background: #b91c1c; }
    </style>
</head>

        // --- 1. СКРИПТ КРУПНОПИКСЕЛЬНОГО СНЕГА ---
        const canvas = document.getElementById('snowCanvas');
        const ctx = canvas.getContext('2d');
        let flakes = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function createFlakes() {
            flakes = [];
            const count = Math.floor(window.innerWidth / 15);
            for(let i=0; i<count; i++) {
                flakes.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    size: Math.random() * 3 + 2, // Крупные квадратные пиксели
                    speed: Math.random() * 1 + 0.5,
                    velX: Math.random() * 0.5 - 0.25
                });
            }
        }
        createFlakes();

        function drawSnow() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#e0f2fe';
            flakes.forEach(f => {
                // Рисуем квадратные пиксельные снежинки
                ctx.fillRect(Math.floor(f.x), Math.floor(f.y), Math.floor(f.size), Math.floor(f.size));
                f.y += f.speed;
                f.x += f.velX;
                if (f.y > canvas.height) {
                    f.y = -10;
                    f.x = Math.random() * canvas.width;
                }
            });
            requestAnimationFrame(drawSnow);
        }
        drawSnow();

        // --- 2. МУЗЫКАЛЬНЫЙ ПЛЕЕР ---
        // Используем безлицензионный чилловый фоновый трек (8-bit lofi)
        const audio = new Audio('https://archive.org');
        audio.loop = true;
        let isPlaying = false;

        function toggleMusic() {
            const btn = document.getElementById('playStopBtn');
            const trackText = document.getElementById('trackName');
            
            if(!isPlaying) {
                audio.play().catch(e => console.log("Нужен клик по экрану для старта"));
                btn.textContent = "STOP";
                btn.style.background = "#ef4444";
                btn.style.borderBottom = "4px solid #b91c1c";
                trackText.textContent = "❄️ Lofi Winter Pixel Chiptune";
                isPlaying = true;
            } else {
                audio.pause();
                btn.textContent = "PLAY";
                btn.style.background = "#0284c7";
                btn.style.borderBottom = "4px solid #0369a1";
                trackText.textContent = "🎵 Музыка на паузе";
                isPlaying = false;
            }
        }

// --- 3. МИНИ-ТЕТРИС ---
const tCanvas = document.getElementById('tetrisCanvas');
const tCtx = tCanvas.getContext('2d');
const ROW = 20, COL = 10, SQ = 20;
let board = Array.from({length: ROW}, () => Array(COL).fill(0));
let score = 0;
let tetrisInterval;
let currentPiece;
const SHAPES = [
[[1,1,1,1]], // I
[[1,1,1],[0,1,0]], // T
[[1,1,1],[1,0,0]], // L
[[1,1,0],[0,1,1]], // Z
[[1,1],[1,1]] // O
];
const COLORS = ['#38bdf8', '#a855f7', '#f97316', '#ef4444', '#eab308'];
class Piece {
constructor(shape, color) {
this.shape = shape;
this.color = color;
this.x = 3;
this.y = -this.shape.length;
}
draw() {
this.shape.forEach((r, i) => r.forEach((v, j) => {
if(v) {
tCtx.fillStyle = this.color;
tCtx.fillRect((this.x+j)*SQ, (this.y+i)*SQ, SQ-1, SQ-1);
}
}));
}
collision(nx, ny, ns = this.shape) {
return ns.some((r, i) => r.some((v, j) => {
if(!v) return false;
let pX = nx + j, pY = ny + i;
if(pX < 0 || pX >= COL || pY >= ROW) return true;
if(pY >= 0 && board[pY][pX]) return true;
return false;
}));
}
moveDown() {
if(!this.collision(this.x, this.y + 1)) { this.y++; }
else { this.lock(); }
}
lock() {
this.shape.forEach((r, i) => r.forEach((v, j) => {
if(v && this.y+i >= 0) board[this.y+i][this.x+j] = this.color;
}));
// Очистка линий
for(let r=0; r<ROW; r++) {
if(board[r].every(v => v !== 0)) {
board.splice(r, 1);
board.unshift(Array(COL).fill(0));
score += 10;
document.getElementById('score').textContent = score;
}
}
newRandomPiece();
}
}
function newRandomPiece() {
let r = Math.floor(Math.random()*SHAPES.length);
currentPiece = new Piece(SHAPES[r], COLORS[r]);
if(currentPiece.collision(currentPiece.x, currentPiece.y)) {
alert("GAME OVER! Твой счет: " + score);
board = Array.from({length: ROW}, () => Array(COL).fill(0));
score = 0;
document.getElementById('score').textContent = score;
}
}
function drawBoard() {
tCtx.clearRect(0,0,tCanvas.width,tCanvas.height);
board.forEach((r, i) => r.forEach((v, j) => {

}));
currentPiece.draw();
}
function updateTetris() {
currentPiece.moveDown();
drawBoard();
}
function openTetris() {
document.getElementById('tetrisModal').style.display = 'flex';
board = Array.from({length: ROW}, () => Array(COL).fill(0));
score = 0;
newRandomPiece();
tetrisInterval = setInterval(updateTetris, 400);
window.addEventListener('keydown', handleControls);
}
function closeTetris() {
document.getElementById('tetrisModal').style.display = 'none';
clearInterval(tetrisInterval);
window.removeEventListener('keydown', handleControls);
}
function handleControls(e) {
if(e.key === 'ArrowLeft' && !currentPiece.collision(currentPiece.x - 1, currentPiece.y)) currentPiece.x--;
if(e.key === 'ArrowRight' && !currentPiece.collision(currentPiece.x + 1, currentPiece.y)) currentPiece.x++;
if(e.key === 'ArrowDown') currentPiece.moveDown();
if(e.key === 'ArrowUp') {
let next = currentPiece.shape[0].map((_, c) => currentPiece.shape.map(r => r[c])).reverse();
if(!currentPiece.collision(currentPiece.x, currentPiece.y, next)) currentPiece.shape = next;
}
drawBoard();
