<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой Личный Сайт</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .card { background: #1e293b; padding: 40px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); text-align: center; max-width: 400px; width: 100%; border: 1px solid #334155; }
        h1 { font-size: 24px; margin-bottom: 10px; color: #38bdf8; }
        p { color: #94a3b8; font-size: 16px; margin-bottom: 30px; line-height: 1.5; }
        .links { display: flex; flex-direction: column; gap: 15px; }
        .btn { background: #38bdf8; color: #0f172a; padding: 12px; border-radius: 8px; text-decoration: none; font-weight: bold; transition: 0.2s ease; }
        .btn:hover { background: #0ea5e9; transform: translateY(-2px); }
        .btn.secondary { background: transparent; color: #38bdf8; border: 2px solid #38bdf8; }
        .btn.secondary:hover { background: rgba(56, 189, 248, 0.1); }
    </style>
</head>
<body>

    <div class="card">
        <h1>Добро пожаловать!</h1>
        <p>Привет! Это мой официальный сайт, запущенный абсолютно бесплатно. Сейчас проект находится в разработке.</p>
        
        <div class="links">
            <!-- Сюда в будущем можно вставить ссылки на ваши проекты -->
            <a href="#" class="btn">Перейти в Блог</a>
            <a href="#" class="btn secondary">Мой Магазин (Скоро)</a>
            <a href="#" class="btn secondary">Форум для общения</a>
        </div>
    </div>

</body>
</html>
