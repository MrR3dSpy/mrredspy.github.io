<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MRREDSPY // INTERFACE</title>
    <style>
        /* Horizon Launcher Cyberpunk Design */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Consolas', 'Courier New', monospace;
        }

        body {
            background-color: #030207;
            /* Генерация пиксельной неоновой сетки на чистом CSS */
            background-image: 
                linear-gradient(rgba(18, 10, 36, 0.3) 2px, transparent 2px),
                linear-gradient(90deg, rgba(18, 10, 36, 0.3) 2px, transparent 2px),
                radial-gradient(circle at center, #0e051b 0%, #020105 100%);
            background-size: 32px 32px, 32px 32px, 100% 100%;
            color: #00ffcc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* Эффект глитча и сканирования на фоне */
        body::before {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 2;
            background-size: 100% 3px, 6px 100%;
            pointer-events: none;
        }

        /* Главный терминал лаунчера */
        .launcher-panel {
            position: relative;
            background: rgba(10, 6, 18, 0.9);
            border: 2px solid #ff0055;
            box-shadow: 0 0 30px rgba(255, 0, 85, 0.2), inset 0 0 15px rgba(255, 0, 85, 0.1);
            width: 100%;
            max-width: 460px;
            padding: 40px 30px;
            z-index: 10;
        }

        /* Декоративные уголки лаунчера */
        .launcher-panel::before {
            content: '';
            position: absolute;
            top: -2px; left: -2px;
            width: 20px; height: 20px;
            border-top: 4px solid #00ffcc;
            border-left: 4px solid #00ffcc;
        }

        .launcher-panel::after {
            content: '';
            position: absolute;
            bottom: -2px; right: -2px;
            width: 20px; height: 20px;
            border-bottom: 4px solid #00ffcc;
            border-right: 4px solid #00ffcc;
        }

        /* Заголовок системы */
        .header {
            text-align: left;
            border-bottom: 1px solid rgba(0, 255, 204, 0.2);
            padding-bottom: 15px;
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .system-status {
            font-size: 11px;
            color: #ff0055;
            text-transform: uppercase;
            letter-spacing: 2px;
            animation: blink 1.5s infinite;
        }

        .nickname {
            font-size: 32px;
            font-weight: 900;
            color: #ffffff;
            text-transform: uppercase;
            letter-spacing: 3px;
            text-shadow: 0 0 10px rgba(0, 255, 204, 0.5);
        }

        /* Ссылки-модули */
        .modules-list {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* STEAM МОДУЛЬ */
        .steam-module {
            display: block;
            text-decoration: none;
            background: rgba(26, 32, 46, 0.4);
            border: 1px solid #101822;
            padding: 20px;
            transition: all 0.2s ease;
            position: relative;
            overflow: hidden;
        }

        .steam-module:hover {
            background: rgba(102, 192, 244, 0.1);
            border-color: #66c0f4;
            box-shadow: 0 0 20px rgba(102, 192, 244, 0.3);
            transform: scale(1.01);
        }

        .steam-module::before {
            content: 'LAUNCH';
            position: absolute;
            right: 20px; top: 50%;
            transform: translateY(-50%);
            font-size: 12px;
            color: #66c0f4;
            font-weight: bold;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .steam-module:hover::before {
            opacity: 1;
        }

        .module-title {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.4);
            text-transform: uppercase;
            margin-bottom: 5px;
            letter-spacing: 1px;
        }

        .module-value {
            font-size: 20px;
            font-weight: bold;
            color: #66c0f4;
            text-shadow: 0 0 5px rgba(102, 192, 244, 0.3);
        }

        /* DISCORD МОДУЛЬ */
        .discord-module {
            background: rgba(88, 101, 242, 0.05);
            border: 1px solid rgba(88, 101, 242, 0.2);
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .discord-module:hover {
            border-color: #5865F2;
            box-shadow: 0 0 20px rgba(88, 101, 242, 0.2);
        }

        .discord-value {
            font-size: 20px;
            font-weight: bold;
            color: #7289da;
            text-shadow: 0 0 5px rgba(88, 101, 242, 0.3);
        }

        .copy-btn {
            background: transparent;
            border: 1px solid #5865F2;
            color: #5865F2;
            padding: 8px 16px;
            font-family: inherit;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            text-transform: uppercase;
            font-size: 12px;
        }

        .copy-btn:hover {
            background: #5865F2;
            color: #ffffff;
            box-shadow: 0 0 10px rgba(88, 101, 242, 0.5);
        }

        /* Анимация мигания */
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
    </style>
</head>
<body>

    <div class="launcher-panel">
        <div class="header">
            <div>
                <div class="system-status">● system online</div>
                <h1 class="nickname">mrredspy</h1>
            </div>
        </div>

        <div class="modules-list">
            <!-- Steam Блок -->
            <a href="https://steamcommunity.com/id/mrredspy_/" target="_blank" class="steam-module">
                <div class="module-title">protocol // steam_id</div>
                <div class="module-value">mrredspy_</div>
            </a>

            <!-- Discord Блок -->
            <div class="discord-module">
                <div>
                    <div class="module-title">comms // discord</div>
                    <div class="discord-value">mrredspy</div>
                </div>
                <button class="copy-btn" onclick="navigator.clipboard.writeText('mrredspy'); this.innerText='COPIED'; setTimeout(()=>this.innerText='COPY', 2000);">Copy</button>
            </div>
        </div>
    </div>

</body>
</html>
